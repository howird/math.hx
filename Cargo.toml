[package]
name = "math-hx"
version = "0.1.0"
edition = "2021"

[lib]
name = "math_hx"
crate-type = ["rlib", "cdylib"]

[dependencies]
steel-core = { version = "0.8.2", git = "https://github.com/mattwparas/steel.git", features = ["dylibs", "sync"] }
abi_stable = "0.11.1"
mitex = "0.2.4"
# Use the bundled command spec instead of regenerating it with `typst` at build time.
mitex-spec-gen = { version = "0.2.4", features = ["prebuilt"] }
pulldown-cmark = { version = "0.13", default-features = false }
typst = "0.15.1"
typst-render = "0.15.1"
typst-layout = "0.15.1"
base64 = "0.22"
libc = "0.2"
tiny-skia = "0.12"
unicode-segmentation = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
